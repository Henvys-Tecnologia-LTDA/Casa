<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Instalar na tela de início (ícones gerados por scripts/make-icons.mjs). -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Casa a Dois" />
    <meta name="theme-color" content="#1C1715" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        margin: 0;
        background-color: #FBF1EF;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Casinha enquanto o JS carrega, no mesmo lugar da tela de carregamento do app (src/ui/Splash.tsx). */
      /* Modo escuro (src/ui/theme.ts): fundo de papel escuro antes do JS. */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1C1715;
        }
      }
      #carregando {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. O React troca o conteúdo ao montar. -->
    <div id="root"><div id="carregando"><picture><source srcset="/marca-escura.svg" media="(prefers-color-scheme: dark)" /><img src="/marca.svg" width="120" height="120" alt="" /></picture></div></div>
  </body>
</html>
